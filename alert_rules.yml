groups:
  - name: llm_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(llm_errors_total[5m]) > 0.05
        for: 2m
        annotations:
          summary: "High error rate on LLM service"
          description: "Error rate is {{ $value }} per second"

      - alert: BudgetThresholdExceeded
        expr: llm_budget_usage_usd > 40
        for: 1m
        annotations:
          summary: "Daily budget threshold exceeded"
          description: "Budget usage is {{ $value }} USD"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(llm_response_latency_seconds_bucket[5m])) > 2
        for: 2m
        annotations:
          summary: "High p95 latency detected"
          description: "p95 latency is {{ $value }} seconds"

      - alert: QualityDegradation
        expr: avg(llm_rouge_l_score) < 0.25
        for: 5m
        annotations:
          summary: "ROUGE-L score below threshold"
          description: "Average ROUGE-L is {{ $value }}"